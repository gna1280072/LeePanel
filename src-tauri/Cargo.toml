[package]
name = "leepanel"
version = "1.0.23"
description = "LeePanel - SSH Server Management Tool"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2"
base64 = "0.22"
async-trait = "0.1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
dirs = "5"
open = "5"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
tauri-plugin-updater = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
keyring = "3"
# keyring 3.6.3 传递依赖 zeroize 1.9.0 要求 zeroize_derive ^1.5（crates.io 无此版本），
# pin 到 1.8.x 规避解析失败
zeroize = "=1.8.1"

# keyring 3.x 必须显式启用平台 backend feature，否则静默回退到 mock store（不持久化！）
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
